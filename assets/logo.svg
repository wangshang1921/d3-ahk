<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">d3-ahk logo</title>
  <desc id="desc">Keyboard-inspired logo with toggle state colors for d3-ahk auto key app</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1a24"/>
      <stop offset="100%" stop-color="#132a3b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3648"/>
      <stop offset="100%" stop-color="#152738"/>
    </linearGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="stateOn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="stateOff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="220" fill="url(#bg)"/>

  <rect x="160" y="196" width="704" height="632" rx="56" fill="url(#panel)" stroke="#2b4458" stroke-width="8" filter="url(#shadow)"/>

  <rect x="220" y="274" width="270" height="240" rx="28" fill="url(#keycap)"/>
  <rect x="534" y="274" width="270" height="240" rx="28" fill="url(#keycap)"/>
  <rect x="220" y="548" width="584" height="204" rx="28" fill="url(#keycap)"/>

  <text x="355" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="132" font-weight="800" fill="#0f172a">D3</text>
  <text x="669" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="98" font-weight="800" fill="#0f172a">AHK</text>
  <text x="512" y="675" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#0f172a">AUTO KEY</text>

  <g transform="translate(762 142)">
    <rect x="0" y="0" width="162" height="68" rx="34" fill="#10202d" stroke="#334a5d" stroke-width="4"/>
    <circle cx="44" cy="34" r="23" fill="url(#stateOff)"/>
    <circle cx="118" cy="34" r="23" fill="url(#stateOn)"/>
  </g>

  <path d="M216 196h632" stroke="#3f5d73" stroke-width="5" opacity="0.5"/>
  <path d="M190 844h644" stroke="#0b1118" stroke-width="10" opacity="0.35"/>
</svg>
